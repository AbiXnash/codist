# REPO=~/dev/your-app docker compose up
# On a Mac the model runs without the GPU here, so it is much slower: prefer the single binary with native Ollama.
services:
  ollama:
    image: ollama/ollama:0.5.7
    volumes:
      - ollama:/root/.ollama
  model:
    image: ollama/ollama:0.5.7
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "sleep 3; ollama pull ${CODIST_MODEL:-qwen2.5-coder:7b}"]
    restart: "no"
  codist:
    build: .
    depends_on: [ollama]
    ports:
      - "${PORT:-8080}:8080"
    environment:
      OLLAMA_URL: http://ollama:11434
      CODIST_MODEL: ${CODIST_MODEL:-qwen2.5-coder:7b}
    volumes:
      - ${REPO:?Set REPO to the repository to review}:/repo
      - codist:/data
volumes:
  ollama:
  codist:
