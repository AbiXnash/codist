name: CI

on:
  push:
    branches: [master, rebuild]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the UI
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build
      - name: Embed the UI
        run: |
          rm -rf server/internal/webui/dist/assets server/internal/webui/dist/index.html
          cp -R web/dist/. server/internal/webui/dist/
      - name: Vet and test the server
        working-directory: server
        run: |
          go vet ./...
          go test ./...
      - name: Build the server
        working-directory: server
        run: go build -o bin/ .
      - name: Test the measuring code
        working-directory: eval
        run: python -m unittest test_run
      - name: Measure the rules, with no model
        run: python eval/run.py --rules-only
      - name: Check the wiki publisher
        run: python scripts/publish_wiki.py --dry-run
