name: wiki
# The wiki is a copy of docs/ on the default branch. Edit docs/, never the wiki: this replaces every page.
on:
  push:
    branches: [remaster]
    paths: ['docs/**', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency: wiki

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the wiki
        run: git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git" wiki

      - name: Copy docs into the wiki
        run: |
          find wiki -maxdepth 1 -name '*.md' -delete
          home=wiki/Home.md
          sidebar=wiki/_Sidebar.md
          {
            echo "# Codist"
            echo
            echo "Codist reviews a Java and Spring Boot repository on your own machine. These pages are copied from"
            echo "[\`docs/\`](https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}/docs) on every change;"
            echo "edit them there. Start with the [README](https://github.com/${{ github.repository }}#readme) for what Codist does."
            echo
          } > "$home"
          echo "**[Home](Home)**" > "$sidebar"
          echo >> "$sidebar"
          # Getting started first, then the rest by name.
          for f in docs/getting-started.md $(ls docs/*.md | grep -v getting-started.md); do
            [ -f "$f" ] || continue
            base=$(basename "$f" .md)
            page="$(printf '%s' "${base:0:1}" | tr '[:lower:]' '[:upper:]')${base:1}"
            title=$(sed -n 's/^# //p' "$f" | head -1)
            {
              echo "> Copied from [\`$f\`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/$f). Edit it there."
              echo
              cat "$f"
            } > "wiki/$page.md"
            echo "- [$title]($page)" >> "$home"
            echo "- [$title]($page)" >> "$sidebar"
          done
          printf '\n---\nPages for the earlier version of Codist are in this wiki'"'"'s history.\n' >> "$home"

      - name: Publish
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Wiki already up to date"; exit 0; fi
          git commit -q -m "Sync from docs/ at ${GITHUB_SHA::7}"
          git push -q
